{% extends "base.html" %}
{% block title %}Error — Dialer Campaign Console{% endblock %}
{% block body %}
<div class="login-screen">
  <div class="login-panel">
    <div class="login-mark">
      <span class="pulse-dot pulse-dot-error"></span>
      <span class="login-mark-text">DIALER CONSOLE</span>
    </div>
    <h1>Something went wrong</h1>
    <div class="alert alert-error">{{ message }}</div>
    <a class="btn btn-primary btn-block" href="{{ url_for('dashboard_root') }}" style="text-align:center;display:block;text-decoration:none;">Try again</a>
    <form method="POST" action="{{ url_for('logout') }}" style="margin-top:12px;">
      <button type="submit" class="btn-link">Log out</button>
    </form>
  </div>
</div>
{% endblock %}
